name: jsonld
description: JSON LD Visual Editor - A powerful, premium cascading column builder for Schema.org JSON-LD and YAML-LD.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.3.0
  dio: ^5.9.1
  go_router: ^17.1.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.3
  downloadsfolder: ^1.2.0
  http: ^1.2.0
  path: ^1.9.0
  uuid: ^4.5.1
  serverpod_database: ^4.1.0-beta.3
  serverpod_serialization: ^4.1.0-beta.3
  serverpod_offline_sync: ^0.0.11
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/antinna_copyrights.png
    - assets/json_ld.png
